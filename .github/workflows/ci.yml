name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke CLI packets
        run: |
          curate examples/results.jsonl \
            --format markdown \
            --rules examples/rules.json \
            --limit 5 \
            --output reports/review-packet.md
          test -s reports/review-packet.md
          curate examples/results.jsonl \
            --format pr-comment \
            --rules examples/rules.json \
            --limit 5 \
            --output reports/review-comment.md
          test -s reports/review-comment.md
          ! grep -q "alice@team.test" reports/review-comment.md
